name: build

# 发布已验收的 Windows 便携包与 Linux 云端 Skill 包；macOS 引擎尚未适配。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: napcat-plugin-auto-tasks/package-lock.json
      - name: Build QQ plugin
        working-directory: napcat-plugin-auto-tasks
        run: |
          npm ci
          cd src/webui
          npm ci
          cd ../..
          node ../tests/test_qq_batch.cjs
          npm run build
      - name: Check Python and UI syntax
        shell: pwsh
        run: |
          python -m compileall -q software/backend software/main.py
          node --check software/ui/app.js
          python -m unittest discover -s tests -v
      - name: Build and verify cloud Skill release asset
        shell: pwsh
        run: |
          python scripts/make_cloud_zip.py
          python scripts/check_cloud_package.py xuhuohua-cloud.zip
      - name: Check Linux deployment scripts
        shell: bash
        run: |
          for file in cloud-skill/xuhuohua-cloud/scripts/*.sh; do bash -n "$file"; done
      - name: Install app dependencies
        run: python -m pip install pywebview pystray==0.19.5 pyinstaller
      - name: Build executable with bundled helpers and QQ plugin
        working-directory: software
        run: pyinstaller --noconfirm --clean xuhuohua.spec
      - name: Install WebView2 Runtime
        shell: pwsh
        run: |
          curl -L -o webview2-installer.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          Start-Process .\webview2-installer.exe -Args "/silent /install" -Wait
      - name: Package and verify portable zip
        shell: pwsh
        run: |
          python scripts/make_portable_zip.py
          python scripts/check_release_package.py xuhuohua-windows-x64.zip
      - name: Smoke test executable extracted from release zip
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "xuhuohua-release-smoke"
          Expand-Archive xuhuohua-windows-x64.zip -DestinationPath $target
          $exe = Get-ChildItem $target -Recurse -Filter xuhuohua.exe | Select-Object -First 1
          if (-not $exe) { throw "发布包中找不到 xuhuohua.exe" }
          $env:XUHUOHUA_SMOKE = "1"
          $proc = Start-Process $exe.FullName -PassThru
          try {
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 1
              $proc.Refresh()
              if ($proc.HasExited) { throw "软件启动后提前退出" }
              if ($proc.MainWindowHandle) { break }
            }
            if (-not $proc.MainWindowHandle) { throw "启动冒烟测试失败：窗口未出现" }
            $log = Join-Path $exe.DirectoryName ("logs/" + (Get-Date -Format "yyyy-MM-dd") + "-software.log")
            if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern '\[托盘\] 已在右下角托盘运行' -Quiet)) {
              throw "启动冒烟测试失败：托盘未就绪"
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: xuhuohua-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-linux-x64
          path: |
            xuhuohua-cloud.zip
            xuhuohua-cloud.zip.sha256
            xuhuohua-cloud-prompt.txt

  release:
    needs: windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach verified release packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xuhuohua-windows-x64.zip
            xuhuohua-cloud.zip
            xuhuohua-cloud.zip.sha256
            xuhuohua-cloud-prompt.txt
