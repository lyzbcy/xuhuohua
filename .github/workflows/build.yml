name: build
# 打 tag（v*）或手动触发：Windows + macOS 双平台打包，产物自动挂到对应 Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd software
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
      - name: Build exe
        run: |
          cd software
          pyinstaller --noconfirm --windowed --icon ui/assets/icon.ico --name xuhuohua --add-data "ui;ui" --collect-all webview --collect-all pythonnet --collect-all clr_loader main.py
      - name: Install WebView2 Runtime
        shell: pwsh
        run: |
          curl -L -o webview2-installer.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          Start-Process .\webview2-installer.exe -Args "/silent /install" -Wait
      - name: Smoke test (窗口必须能拉起)
        shell: pwsh
        run: |
          Start-Process "software/dist/xuhuohua/xuhuohua.exe"
          Start-Sleep -Seconds 15
          $p = Get-Process xuhuohua -ErrorAction SilentlyContinue
          if (-not $p -or -not $p.MainWindowTitle) { Write-Error "启动冒烟测试失败：窗口未出现"; exit 1 }
          Stop-Process -Name xuhuohua -Force
          Write-Output "SMOKE_OK"
      - name: Package portable zip
        shell: pwsh
        run: |
          python scripts/make_portable_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-only
          path: xuhuohua-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd software
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
      - name: Build app
        run: |
          cd software
          pyinstaller --noconfirm --windowed --name xuhuohua --add-data "ui:ui" --collect-all webview --collect-all pythonnet --collect-all clr_loader main.py
      - name: Package zip
        run: |
          mkdir -p pkg
          cp -R software/dist/xuhuohua.app pkg/
          cp VERSION pkg/VERSION
          ditto -c -k --keepParent pkg xuhuohua-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: xuhuohua-macos.zip

  release:
    needs: [windows, macos]   # Windows 正式分发包含 NapCat 等二进制，由维护者本机构建后上传；CI 只做 macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xuhuohua-macos.zip
