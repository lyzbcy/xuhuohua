name: build
# 打 tag（v*）或手动触发：Windows + macOS 双平台打包，产物自动挂到对应 Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd software
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
      - name: Build exe
        run: |
          cd software
          pyinstaller --noconfirm --windowed --icon ui/assets/icon.ico --name xuhuohua --add-data "ui;ui" --collect-all webview main.py
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item software/dist/xuhuohua/* pkg/ -Recurse -Force
          Copy-Item VERSION pkg/VERSION -Force
          Compress-Archive -Path pkg/* -DestinationPath xuhuohua-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: xuhuohua-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd software
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
      - name: Build app
        run: |
          cd software
          pyinstaller --noconfirm --windowed --name xuhuohua --add-data "ui:ui" --collect-all webview main.py
      - name: Package zip
        run: |
          mkdir -p pkg
          cp -R software/dist/xuhuohua.app pkg/
          cp VERSION pkg/VERSION
          ditto -c -k --keepParent pkg xuhuohua-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: xuhuohua-macos.zip

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xuhuohua-windows-x64.zip
            xuhuohua-macos.zip
