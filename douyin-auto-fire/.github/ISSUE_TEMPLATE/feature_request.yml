name: Feature Request

description: 提议新功能或改进现有功能
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 请说明你遇到的实际需求或问题。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 希望的解决方案
      description: 描述你希望项目增加或调整什么。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 如果你考虑过替代方案，也可以写在这里。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议。
          required: true
        - label: 这个建议与 douyin-auto-fire 的项目目标相关。
          required: true
